<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wedding RSVP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .rsvp-form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        .btn-accept {
            background-color: #27ae60;
            color: white;
        }
        .btn-decline {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>
<div class="rsvp-form">
    <h2 class="text-center mb-3">Wedding RSVP</h2>

<!--    <div class="alert alert-info text-center mb-3">-->
<!--        Link accessed <span th:text="${guest.clickCount}"></span> times-->
<!--    </div>-->

    <form id="rsvpForm">
        <div class="mb-3">
            <label for="guestName" class="form-label">Full Name *</label>
            <input type="text" id="guestName" name="guestName" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email Address *</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="phoneNumber" class="form-label">Phone Number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control">
        </div>

        <div class="mb-3">
            <label for="dietaryRestrictions" class="form-label">Dietary Restrictions</label>
            <textarea id="dietaryRestrictions" name="dietaryRestrictions" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label for="squad" class="form-label">Select Squad</label>
            <select id="squad" name="squad" class="form-select" required>
                <option value="">-- Select Squad --</option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="button" class="btn btn-accept w-50" onclick="submitResponse('accept')">
                ✓ Accept
            </button>
            <button type="button" class="btn btn-decline w-50" onclick="submitResponse('decline')">
                ✗ Decline
            </button>
        </div>
    </form>
</div>

<script th:inline="javascript">
    const token = /*[[${token}]]*/ "";
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const res = await fetch("/api/v1/invite/squads");
            const squads = await res.json();

            const squadLabels = {
                "BRIDE": "Bride's Squad",
                "GROOM": "Groom's Squad"
            };

            const squadSelect = document.getElementById("squad");
            squads.forEach(s => {
                const option = document.createElement("option");
                option.value = s;
                option.text = squadLabels[s] || s;
                squadSelect.appendChild(option);
            });
        } catch (error) {
            console.error("Failed to load squads:", error);
        }
    });

    async function submitResponse(response) {
        const form = document.getElementById('rsvpForm');
        const formData = new FormData(form);

        const data = {
            guestName: formData.get('guestName'),
            email: formData.get('email'),
            phoneNumber: formData.get('phoneNumber'),
            dietaryRestrictions: formData.get('dietaryRestrictions'),
            squad: formData.get('squad'),
            response: response
        };

        try {
            const result = await fetch('/api/v1/invite/rsvp/' + token,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

            const responseData = await result.json();

            if (result.ok) {
                if (response === 'accept') {
                    document.body.innerHTML = `
                        <div class="rsvp-form text-center">
                            <h2>Thank You!</h2>
                            <p>${responseData.message}</p>
                            <p><strong>Your Seat:</strong> ${responseData.seatNumber}</p>
                            <a href="${responseData.invitationCardUrl}" target="_blank" class="btn btn-accept w-100 mt-3">
                                Generate Invitation Card
                            </a>
                        </div>`;
                } else {
                    document.body.innerHTML = `
                        <div class="rsvp-form text-center">
                            <h2>Response Recorded</h2>
                            <p>${responseData.message}</p>
                        </div>`;
                }
            } else {
                alert('Error: ' + responseData.message);
            }
        } catch (error) {
            alert('Error submitting RSVP: ' + error.message);
        }
    }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    function downloadAsImage() {
        const confirmationDiv = document.querySelector(".rsvp-form");
        html2canvas(confirmationDiv).then(canvas => {
            const link = document.createElement("a");
            link.href = canvas.toDataURL("image/png");
            link.download = "rsvp-confirmation.png";
            link.click();
        });
    }
</script>

</body>
</html>
