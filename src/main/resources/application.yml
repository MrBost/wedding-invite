spring:
  application:
    name: wedding-invite

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rsvp}?useEncoding=true&characterEncoding=UTF-8
    hikari:
      username: ${DB_USER_NAME:postgres}
      password: ${DB_PASSWORD:1234}
      driver-class-name: org.postgresql.Driver

server:
  port: 2714

wedding:
  invitation:
    base-url: http://localhost:2714
    card:
      template-path: ./templates
      output-path: ./generated-cards
    venue:
      max-guests: 100
      seats-per-table: 10

logging:
  level:
    com.wedding.invitation: DEBUG
