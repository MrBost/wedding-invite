<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wedding Invitation - Oluwasuen & Opeyemi</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invitation-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 3px solid #d4af37;
        }
        .bride-groom {
            font-size: 24px;
            color: #d4af37;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .guest-name {
            font-size: 20px;
            color: #2c3e50;
            margin: 15px 0;
            font-style: italic;
        }
        .wedding-details {
            font-size: 14px;
            color: #34495e;
            margin: 15px 0;
            line-height: 1.5;
        }
        .seat-info {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #d4af37;
            font-size: 14px;
        }
        .footer {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 20px;
        }
        button {
            background: #27ae60;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
        }
        button:hover {
            opacity: 0.9;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .invitation-card {
                padding: 15px;
                border-width: 2px;
            }
            .bride-groom {
                font-size: 20px;
            }
            .guest-name {
                font-size: 18px;
            }
            .wedding-details {
                font-size: 13px;
            }
            .seat-info {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="invitation-card" id="invitationCard">
        <div class="bride-groom">Oluwasuen & Opeyemi</div>
        <h2>cordially invite</h2>
        <div class="guest-name">Hannah</div>
        <div class="wedding-details">
            <p><strong>Date:</strong> December 20, 2025</p>
            <p><strong>Time:</strong> 10:00 AM</p>
            <p><strong>Venue:</strong> Advans Event Special</p>
            <p><strong>Address:</strong> 123 Opebi Street, Ikeja, Lagos State</p>
        </div>
        <div class="seat-info">
            <p><strong>Your Reserved Seat:</strong> B1-S6</p>
        </div>
        <p>We can't wait to celebrate with you!</p>
        <div class="footer">
            <p>Generated on: 2025-09-20T16:13:52.899594600</p>
        </div>
        <button id="downloadBtn" onclick="downloadAsImage()">
            Download Invitation Card
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        function downloadAsImage() {
            const card = document.getElementById("invitationCard");
            const btn = document.getElementById("downloadBtn");

            // Hide button before snapshot
            btn.style.display = "none";

            html2canvas(card).then(canvas => {
                const link = document.createElement("a");
                link.href = canvas.toDataURL("image/png");
                link.download = "invitation-card-Hannah.png"; // dynamic guest file name
                link.click();
            }).catch(err => {
                console.error("Error generating image:", err);
            }).finally(() => {
                // Restore button
                btn.style.display = "inline-block";
            });
        }
    </script>
</body>
</html>
